<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 m-5 grid gap-10 lg:m-0 lg:my-12 lg:mx-20 lg:items-center"> 

    <h1 class="text-2xl font-bold text-center mb-6">Liste de Courses</h1>

    <ul id="shopping-list" class="list-disc pl-5">

    </ul>
    
    <div id="toast-container" class="fixed bottom-5 right-5 z-50">
        <div id="toast" class="hidden bg-green-500 text-white p-4 rounded-lg shadow-lg opacity-0 transform transition-all duration-300">
            <span id="toast-message">Ingrédients ajoutés à votre liste de courses!</span>
        </div>
    </div>

    <button id="download-pdf" class="mt-4 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
        Télécharger la Liste en PDF
    </button>

   <script src="../js/courses.js"></script>
   <script src="../js/pdf.js"></script>
</body>
</html>
