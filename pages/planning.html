<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palnning</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-950 m-5 grid gap-10 lg:m-0 lg:my-12 lg:mx-20 lg:items-center">
    
    <section class="container mx-auto bg-indigo-200 p-6 rounded-lg pt-1 pb-16">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-200">Planning des repas</h1>
        <form id="form" class="flex flex-col items-center">
            <label for="date" class="text-blue-950 font-bold">Choisissez une recette:</label>
            <select id="recette" name="recette" class="w-1/2 p-2 mb-4 mt-3">
                <option value="0">Choisissez une recette</option>
            </select>
        </form>

        <form id="form" class="flex flex-col items-center">
            <label for="date" class="text-blue-950 font-bold mt-10">Choisissez une date:</label>
            <input type="date" id="date" name="date" class="w-1/2 p-2 mb-4 mt-3">
            <button id="ajouter" class="bg-blue-950 text-white font-bold py-2 px-4 rounded mt-3">Ajouter</button>
        </form>

        <table id="planning" class="hidden border-collapse border border-stone-950 w-1/2 mx-auto mt-24 text-center">
            <thead>
                <tr>
                    <th class="px-4 py-2 text-blue-950 font-bold px-4 py-2 border border-blue-950">Date</th>
                    <th class="px-4 py-2 text-blue-950 font-bold px-4 py-2 border border-blue-950">Recette</th>
                </tr>
            </thead>
            <tbody class="px-4 py-2 border-stone-950"></tbody><!--les entrées du planning seront ajoutées ici-->
        </table>
    </section>

    <script src="../js/planning.js"></script>
</body>
</html>
