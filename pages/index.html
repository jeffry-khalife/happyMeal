<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - HappyMeal</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 m-5 lg:m-0 lg:my-12 lg:mx-20 lg:items-center">

    <nav class="bg-green-500 shadow-md p-4 flex justify-between items-center">
        <a href="index.html" class="text-3xl font-bold text-white">HappyMeal</a>
        
        <ul class="flex gap-12">
            <li><a href="recettes.html" class="text-gray-700 hover:text-green-600 flex items-center">
                <img src="../assets/images/recettes.png" alt="Recettes" class="w-12 h-12"> </a></li>
            <li><a href="favoris.html" class="text-gray-700 hover:text-green-600 flex items-center">
                <img src="../assets/images/favoris.png" alt="Recettes" class="w-12 h-12"> </a></li>
            <li><a href="courses.html" class="text-gray-700 hover:text-green-600 flex items-center">
                <img src="../assets/images/courses.png" alt="Recettes" class="w-12 h-12"> </a></li>
            <li><a href="planning.html" class="text-gray-700 hover:text-green-600 flex items-center">
                <img src="../assets/images/calendrier.png" alt="Recettes" class="w-12 h-12"> </a></li>
        </ul>
    </nav>

    <section class="text-right">
        <input id="search-recette" list="recettes-list" placeholder="Rechercher une recette..." class="w-80 p-2 mb-4 mt-3 border border-green-50"/>
        <datalist id="recettes-list"></datalist>
        <button id="search-button" class="text-sm text-white font-bold py-2 px-4 rounded mt-3 ml-2 mr-2 bg-green-500 hover:bg-lime-400">Rechercher</button>
    </section>

    <h2 class="text-4xl font-bold text-gray-700 text-center mb-8">Découvrez nos recettes du jour !</h2>

    <!-- 🔹 Section des recettes aléatoires -->
    <div id="random-recipes-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <script src="../js/index.js"></script>
    <script src="js/autocomplete.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
